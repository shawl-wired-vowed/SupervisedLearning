name: Task Runner

on:
  workflow_dispatch:
    inputs:
      runs_left:
        type: number
        required: false
        description: "Additional runs remaining"
        default: 4

permissions:
  contents: read

jobs:
  gpu-task:
    name: RTX 6000 Runner
    if: ${{ inputs.runs_left != 1 }}
    runs-on: machine/id=${{ github.run_id }}/runner=rtx6000-12xl/architecture=x64/tenancy=spot/regions=eu-south-2
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run approved GPU workload
        shell: bash
        run: |
          set -euo pipefail
          echo "GPU workload started."
          # Add your authorized workload commands here.

  gpu-task-30:
    name: RTX 6000 Runner (final run)
    if: ${{ inputs.runs_left == 1 }}
    runs-on: machine/id=${{ github.run_id }}/runner=rtx6000-12xl/architecture=x64/tenancy=spot/regions=eu-south-2
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run approved GPU workload
        shell: bash
        run: |
          set -euo pipefail
          echo "Final GPU workload started."
          # Add your authorized workload commands here.

  schedule-next:
    name: Dispatch next GPU run
    needs:
      - gpu-task
      - gpu-task-30
    if: ${{ always() && inputs.runs_left > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUNS_LEFT: ${{ inputs.runs_left }}
        shell: bash
        run: |
          set -euo pipefail

          NEXT=$((RUNS_LEFT - 1))
          if (( NEXT < 1 )); then
            echo "No further runs to dispatch."
            exit 0
          fi

          gh workflow run supervised-fine-tuning.yaml \
            --repo "$REPO" \
            --ref main \
            -f runs_left="$NEXT"
